  # --- observed only with local (non-registry) rules; ids shown in CANONICAL form, which
  # normalise.py must produce by stripping the rules-root path prefix -----------------
  - id: "semgrep:c.lang.security.double-free"
    measures: [mp.sw.1]
    observed: true
    note: >-
      p/c ships 2 rules and found nothing; the public c/ directory has 16 and found 12,
      including this. Raw local id is
      "private.tmp.…semgrep-rules.c.lang.security.double-free" — unnormalised it would land
