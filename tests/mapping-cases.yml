  - id: "semgrep:swift.sqllite.swift-potential-sqlite-injection"
    measures: [mp.sw.1]
    observed: true
    note: >-
      the only unmapped id of round 9. Swift rules are not under swift.lang.*, and
      "sql-injection" does not match "sqlite-injection" — hence the language-wide fallback.

