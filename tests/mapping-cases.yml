  - id: "semgrep:scala.lang.security.audit.tainted-sql-string"
    measures: [mp.sw.1]
    observed: true
    note: >-
      deliberately NOT mp.s.2. The `sql-injection|execute-raw-query|sqlalchemy` pattern does not
      match "tainted-sql-string", and that is the right outcome: SQL injection reached through a
      web framework namespace (java.spring, python.django) pairs with mp.s.2, but the same defect
      class in a batch job or library is a development defect only. Widening the injection
      pattern would file non-web code under a web-services measure.

