# --- must fall through to the unmapped appendix --------------------------------------
# No engine/ecosystem coverage yet. If one of these starts matching, either the mapping
# grew a rule too broad or the scope list changed — both need a deliberate commit.
unmapped:
  - id: "gitleaks:aws-access-token"
    note: engine deferred to v2 (004-v2-engines) — an unknown ENGINE, not an unknown rule
  - id: "checkov:CKV_AWS_20"
    note: same, v2 engine
  - id: "mysteryengine:SOME-RULE-1"
    note: >-
      a wholly unknown engine. After ten repos, unknown-ENGINE is the only reliable way to
      reach the appendix — the language catch-alls absorb unknown rules within known engines.
      Spec 002's fixture should be built from this shape.
  - id: "semgrep:ocaml.lang.security.foo.bar"
    note: >-
      unknown LANGUAGE inside a known engine. Three earlier probes of this kind were proven
      wrong by real scans (docker-compose, generic.secrets, and the terraform/AVD cloud ids),
      so this one is a live hypothesis, not a fact — if OCaml findings ever appear, map them
      rather than trusting this line.
