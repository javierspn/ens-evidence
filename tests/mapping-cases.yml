# Mapping contract: "<tool>:<rule-id>" -> expected measures. Data-driven test input for
# mapper.py (spec 002). Editing src/ens_evidence/mapping/ens_rd311.yml without updating this file should
# turn the test suite red — that is the point.
#
# `observed: true` means the rule id was seen firing in a real scan
# (docs/scan-baseline.md). The rest are shape probes: plausible ids from engines and
# ecosystems we do not cover yet, kept to pin the fall-through behaviour.
#
# The `unmapped` block has no real fixture: across 632 findings and 246 rule ids from five
# private and three public repositories, every observed id matched a rule. Without these
# synthetic probes the `unmapped` appendix would ship untested — and one probe already had
# to be promoted to an observed case when the public corpus fired it, so treat the list as
# assumptions awaiting contradiction, not as settled behaviour.

version: 1

cases:
