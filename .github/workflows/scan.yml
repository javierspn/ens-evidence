# The tool scans itself and publishes its own report — the credibility artifact.
#
# LICENCE CONSTRAINT — do not break when editing this file:
# rules are fetched at run time into $RULES_DIR (outside the working tree, so the scan does
# not scan them) and MUST NOT appear in any uploaded
# artifact, cache key payload, or committed file. Upload the staged copy of out/latest/
# only, never the repository root. Semgrep Rules License v1.0 forbids redistribution, and a
# public build artifact containing rule files is redistribution. See DESIGN.md "Rule
# sourcing and licensing". The "no rule file leaves this runner" step below is the
# enforcement; it must stay, and it must run before the upload.
name: self-scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SEMGREP_VERSION: '1.171.0'
  TRIVY_VERSION: '0.72.0'
  # Deliberately outside the working tree: anything under it becomes part of `scan .`.
  RULES_DIR: /home/runner/ens-rules

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the tool
        run: pip install .

      # Engines are pinned, not floated: their versions land in run.json, and a floating
      # engine makes the published evidence non-reproducible (principle I).
      - name: Install pinned engines
        run: |
          pip install "semgrep==${SEMGREP_VERSION}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          semgrep --version
          trivy --version
          # The scan runs Trivy with --skip-db-update for reproducibility, and Trivy
          # refuses that on a runner with no database ("--skip-db-update cannot be
          # specified on the first run"). Fetch it once here so the scan stays hermetic.
          trivy fs --download-db-only
          # No equivalent download-only flag exists for the misconfiguration checks bundle,
          # so fetch it by scanning an empty directory. Without it --skip-check-update leaves
          # the misconfig scanner with no checks and run.json declares no bundle digest.
          trivy fs --scanners misconfig -o /dev/null "$(mktemp -d)"
          trivy version --format json

      # Fetched at run time at the SHA tracked in .github/semgrep-rules.sha. Deliberately
      # not cached: a cache of rule content is a mirror we would be maintaining.
      - name: Fetch the rules at the pinned SHA
        run: |
          PIN="$(tr -d '[:space:]' < .github/semgrep-rules.sha)"
          if [ ${#PIN} -ne 40 ]; then
            echo "::error::.github/semgrep-rules.sha must hold one 40-character commit SHA" >&2
            exit 1
          fi
          # Outside the working tree on purpose: fetched into ./.ens-rules, the checkout is
          # part of what `scan .` then scans. Verified 2026-07-28 — 1304 of 1380 published
          # findings were about semgrep's own rule fixtures rather than this repository,
          # and the licence guard did not see it because it matches file names, not the
          # paths a finding refers to.
          ens-evidence rules fetch --sha "$PIN" --rules-root "$RULES_DIR" --accept-rules-license
          ens-evidence rules status . --rules-root "$RULES_DIR"

      # Reports; does not gate. Gating every push on our own findings would couple
      # unrelated changes to upstream rule drift. `baseline update` is deliberately absent:
      # it would silently accept our own findings as the new normal.
      # Exit 1 is "there are findings" and must not gate. Exit 2 is a tool error and must:
      # swallowing it left the job to fail two steps later on a missing run store, which is
      # how the first real execution of this workflow reported a Trivy problem as a render one.
      # --rules-root is what makes the fetch above matter. Without it the scan silently
      # falls back to the semgrep registry (`p/default`) and run.json records
      # "mode": "registry" — the pin is decorative and the published evidence is not
      # reproducible. Verified 2026-07-28 on the first green run of this workflow.
      - name: Scan this repository
        run: |
          status=0
          ens-evidence scan . --rules-root "$RULES_DIR" || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
            echo "scan exit $status — findings reported, not gating"
            exit 0
          fi
          echo "::error::ens-evidence scan failed with exit $status" >&2
          exit "$status"

      - name: Render the report and the bundle
        run: |
          ens-evidence report .
          ens-evidence bundle .

      # Allow-list, not `cp -R out/latest/.`: the run store also keeps the engines' raw
      # SARIF, and semgrep's SARIF embeds the tool driver's ENTIRE rule catalogue — 2126
      # rule descriptions for the 9 that fired, ~3.9 MB, verified 2026-07-26 at the pinned
      # SHA. Publishing that is publishing the licensed rules in another shape, and a
      # *.yaml/*.yml guard does not see it.
      - name: Stage the artifact
        run: |
          mkdir -p upload
          for f in findings.jsonl run.json report.md bundle.md sbom.cdx.json; do
            cp "out/latest/$f" upload/
          done

      # SC-003: verified by a check, not by review — one path typo in the upload step is a
      # licence breach, so the guard runs over the staged directory itself.
      #
      # To prove this guard fires (a guard that scans nothing passes forever), add to the
      # step above:
      #   cp "$RULES_DIR/python/lang/security/audit/exec-detected.yaml" upload/
      # and re-run: the job must fail here, naming that file.
      - name: No rule file leaves this runner
        run: |
          if [ ! -d upload ] || [ -z "$(ls -A upload)" ]; then
            echo "::error::nothing staged for upload — the scan produced no run" >&2
            exit 1
          fi
          offenders="$(find upload \( -name '*.yaml' -o -name '*.yml' -o -name '*.sarif' -o -path '*.ens-rules*' \) -print)"
          if [ -n "$offenders" ]; then
            echo "::error::rule-shaped or rule-carrying files staged for upload — Semgrep Rules License v1.0 forbids redistributing them (SARIF counts: it embeds the whole rule catalogue):" >&2
            echo "$offenders" >&2
            exit 1
          fi
          # Names are not enough: the staged evidence is JSON and Markdown, and a run that
          # scanned the rules checkout fills them with its paths and rule text while every
          # file name stays innocent. Verified 2026-07-28, when exactly that shipped.
          if grep -rIlF -e "$RULES_DIR" -e '.ens-rules' upload; then
            echo "::error::staged evidence refers to the rules checkout (files listed above) — the scan included $RULES_DIR instead of only the repository" >&2
            exit 1
          fi
          echo "staged for upload:"
          find upload -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: ens-evidence-self-scan
          # The staged copy of out/latest/ ONLY. Never '.', never out/, never .ens-rules/.
          path: upload/
          if-no-files-found: error
