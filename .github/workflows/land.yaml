name: land

# Merges every open PR that javier pushed (Agit: git push origin HEAD:refs/for/main)
# once all its checks are green, with the forgejo-ci bot's token. A cron, not a PR
# job, on purpose: Forgejo exposes repo secrets to `schedule`, never to `pull_request`,
# so the token never reaches a workflow a PR can edit. PRs from any other account
# (hermes, a fork) are left for a human. ADR 0001 phase 6.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  land:
    runs-on: [self-hosted, bellatrix]
    steps:
      - name: merge green PRs by javier
        env:
          TOKEN: ${{ secrets.CI_MERGE_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -u
          [ -n "$TOKEN" ] || { echo "::error::CI_MERGE_TOKEN is empty"; exit 1; }
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$RUNNER_TEMP/auth.curl"
          trap 'rm -f "$RUNNER_TEMP/auth.curl"' EXIT
          curl -fsS -K "$RUNNER_TEMP/auth.curl" "$API/pulls?state=open&limit=50" > "$RUNNER_TEMP/pulls.json"
          python3 - "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/todo" <<'PY'
          import json, sys
          for p in json.load(open(sys.argv[1])):
              if p["user"]["login"] == "javier" and not p.get("draft"):
                  print(p["number"], p["head"]["sha"])
          PY
          [ -s "$RUNNER_TEMP/todo" ] || { echo "no open PRs by javier"; exit 0; }
          while read -r n sha; do
            state=$(curl -fsS -K "$RUNNER_TEMP/auth.curl" "$API/commits/$sha/status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            echo "PR #$n @ ${sha:0:7}: checks $state"
            [ "$state" = success ] || continue
            code=$(curl -s -o "$RUNNER_TEMP/merge.out" -w '%{http_code}' -K "$RUNNER_TEMP/auth.curl" -H 'Content-Type: application/json' \
              -X POST "$API/pulls/$n/merge" -d '{"Do":"merge","delete_branch_after_merge":true}')
            echo "  merge: HTTP $code $(cat "$RUNNER_TEMP/merge.out")"
          done < "$RUNNER_TEMP/todo"
