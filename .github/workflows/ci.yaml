name: ci

# Runs on the bellatrix host-mode runner (cosmos docs/apps/forgejo.md): python3, pandoc and
# poppler are on the host, nothing else. Each job builds a venv; the pinned engines come from
# .github/ci-engines.sh (user-local, no sudo). Ported from ubuntu-latest 2026-11-02. The gate
# that runs on every PR and push is gates.yaml (scripts/gates.sh all + gitleaks); these suites
# are the ones that need real engines or a PDF toolchain.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SEMGREP_VERSION: '1.171.0'
  TRIVY_VERSION: '0.72.0'

jobs:
  # Enabled once tests/test_mapping_contract.py existed. src/ is all stubs, so this
  # job's real subject is the DATA: mapping regexes that silently stop matching, a
  # measure drifting out of scope, or the canonical measure list diverging between the
  # places principle III binds. A python linter cannot see any of that.
  test:
    runs-on: [self-hosted, bellatrix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # test_sample_contract.py checks the sample's commit is still reachable
      - name: Install dependencies
        run: |
          python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/pip install -q -e .
      - name: Verify the installed CLI works
        run: ens-evidence --help

      - name: Run tests
        # 'engines' tests need real semgrep/trivy binaries; this job gates the
        # data files and the pure-python pipeline, engine-free.
        run: pytest tests/ -v --tb=short -m "not engines"

  # The engines suite had no runner. Every defect of 2026-07-28 lived in the pinned
  # pipeline — fetch, scan, render, guard — and the `test` job above cannot see any of it:
  # it renders a committed fixture offline and never starts an engine. Six of them shipped
  # under a green suite. This job is what makes tests/test_pinned_pipeline.py mean anything.
  pinned-pipeline:
    runs-on: [self-hosted, bellatrix]
    steps:
      - uses: actions/checkout@v4

      - name: Install the tool and pinned engines
        run: |
          python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -q -r requirements-dev.txt
          pip install -q .
          bash .github/ci-engines.sh

      # Outside the working tree: a checkout inside it becomes part of what the tests scan.
      # runner.temp is this job's own directory, so parallel jobs on the one host never share it.
      - name: Fetch the rules at the pinned SHA
        run: |
          PIN="$(tr -d '[:space:]' < .github/semgrep-rules.sha)"
          ens-evidence rules fetch --sha "$PIN" --rules-root "${{ runner.temp }}/ens-rules" --accept-rules-license

      - name: Run the engines suite
        env:
          ENS_TEST_RULES_ROOT: ${{ runner.temp }}/ens-rules
        run: pytest tests/ -v --tb=short -m engines

  # Every presentation defect this project has hit was invisible to the unit suite and
  # obvious on the rendered page: a leaked absolute path, a finding id clipped at the right
  # margin, a quoted engine message cut mid-sentence. Its own job because it needs a PDF
  # toolchain the other jobs have no use for: pandoc and poppler are on the host, weasyprint
  # is pip (pango and cairo are there).
  rendering:
    runs-on: [self-hosted, bellatrix]
    steps:
      - uses: actions/checkout@v4

      - name: Install the tool and the PDF toolchain
        run: |
          python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/pip install -q . weasyprint

      # The tests skip themselves when the toolchain is absent, which is right on a laptop
      # and wrong here: this job exists to run them.
      - name: Run the rendering suite
        run: |
          pandoc --version >/dev/null && weasyprint --version >/dev/null && pdftotext -v
          pytest tests/ -v --tb=short -m rendering

  # Mapping-coverage gate for a rules bump. Constitution 1.4.0: bumping the pinned
  # semgrep-rules SHA must scan the fixture corpus, and any NEW unmapped rule id must be
  # mapped before the bump merges — otherwise mapping coverage decays silently with every
  # upstream release, and a finding that should evidence a measure lands in the appendix.
  #
  # Only runs when the pin file changes: the loop is about the bump. Running it on every
  # push would spend engine time proving nothing and couple unrelated PRs to rule drift.
  #
  # A bump that REMOVES upstream rule ids is not a failure — the mapping then has stale
  # entries, which cost nothing and cannot lose coverage. Only new unmapped ids gate.
  rules-bump:
    runs-on: [self-hosted, bellatrix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the pinned rules SHA change?
        id: pin
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
               | grep -qx '.github/semgrep-rules.sha'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pin file untouched — the mapping-coverage gate does not apply"
          fi

      - name: Install the tool and pinned engines
        if: steps.pin.outputs.changed == 'true'
        run: |
          python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -q .
          bash .github/ci-engines.sh

      - name: Fetch the rules at the NEW pinned SHA
        if: steps.pin.outputs.changed == 'true'
        run: |
          PIN="$(tr -d '[:space:]' < .github/semgrep-rules.sha)"
          if [ ${#PIN} -ne 40 ]; then
            echo "::error::.github/semgrep-rules.sha must hold one 40-character commit SHA" >&2
            exit 1
          fi
          ens-evidence rules fetch --sha "$PIN" --accept-rules-license
          ens-evidence rules status .

      # Each fixture is scanned from a work tree of its own: semgrep reads only git-tracked
      # files AND its defaults skip anything under tests/, so scanning them in place reports
      # "0 files scanned" and the gate would pass having examined nothing.
      - name: Scan the fixture corpus with the new rules
        if: steps.pin.outputs.changed == 'true'
        run: |
          set -eu
          RULES="$PWD/.ens-rules"
          runs=""
          for fx in vulnerable-app injection-app; do
            work="$(mktemp -d)"
            cp -R "tests/fixtures/$fx/." "$work/"
            git -C "$work" init -q .
            git -C "$work" add -A
            git -C "$work" -c user.email=ci@local -c user.name=ci commit -qm "$fx"
            ens-evidence scan "$work" --rules-root "$RULES" || true
            found="$(ls "$work"/out/*/findings.jsonl | tail -1)"
            [ -s "$found" ] || { echo "::error::$fx produced no findings — the gate would pass vacuously" >&2; exit 1; }
            runs="$runs $found"
          done
          echo "scanned runs:$runs"
          echo "RUNS=$runs" >> "$GITHUB_ENV"

      - name: Every new rule id must be mapped
        if: steps.pin.outputs.changed == 'true'
        run: |
          # shellcheck disable=SC2086
          if ! python scripts/unmapped_ids.py $RUNS; then
            echo "::error::the new rules produced findings with no mapping entry (listed above) — add them to src/ens_evidence/mapping/ens_rd311.yml in this PR" >&2
            exit 1
          fi
