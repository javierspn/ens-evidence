<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 400" role="img">
<title>Trust boundary</title>
<desc>Source, scan, and full report stay inside the customer's infrastructure; only counts and dates may optionally cross to a hosted tier.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}
.gy rect{fill:#F1EFE8;stroke:#5F5E5A}.gy .th{fill:#2C2C2A}.gy .ts{fill:#5F5E5A}
.pu rect{fill:#EEEDFE;stroke:#534AB7}.pu .th{fill:#26215C}.pu .ts{fill:#534AB7}
.te rect{fill:#E1F5EE;stroke:#0F6E56}.te .th{fill:#04342C}.te .ts{fill:#0F6E56}
.arr{stroke:#5F5E5A;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="te"><rect x="40" y="40" width="420" height="320" rx="20" stroke-width="1"/>
<text class="th" x="250" y="72" text-anchor="middle">Customer's infrastructure</text>
<text class="ts" x="250" y="90" text-anchor="middle">nothing sensitive ever leaves</text></g>

<g class="gy"><rect x="140" y="110" width="220" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="250" y="130" text-anchor="middle" dominant-baseline="central">Source code</text>
<text class="ts" x="250" y="149" text-anchor="middle" dominant-baseline="central">never uploaded</text></g>

<path class="arr" d="M250 162 L250 184" marker-end="url(#a)"/>

<g class="gy"><rect x="140" y="186" width="220" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="250" y="206" text-anchor="middle" dominant-baseline="central">ens-evidence in their CI</text>
<text class="ts" x="250" y="225" text-anchor="middle" dominant-baseline="central">GitHub Action · GitLab job</text></g>

<path class="arr" d="M250 238 L250 260" marker-end="url(#a)"/>

<g class="gy"><rect x="130" y="262" width="240" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="250" y="282" text-anchor="middle" dominant-baseline="central">Their artifact store</text>
<text class="ts" x="250" y="301" text-anchor="middle" dominant-baseline="central">report · SBOM · findings</text></g>

<path class="arr" d="M365 212 L488 212" stroke-dasharray="4 3" marker-end="url(#a)"/>

<g class="pu"><rect x="495" y="176" width="145" height="72" rx="10" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="567" y="198" text-anchor="middle" dominant-baseline="central">Hosted tier</text>
<text class="ts" x="567" y="216" text-anchor="middle" dominant-baseline="central">optional · later</text>
<text class="ts" x="567" y="232" text-anchor="middle" dominant-baseline="central">counts + dates only</text></g>

<text class="ts" x="567" y="290" text-anchor="middle" fill="#5F5E5A">no source</text>
<text class="ts" x="567" y="308" text-anchor="middle" fill="#5F5E5A">no finding detail</text>
</svg>
