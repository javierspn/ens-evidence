[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ens-evidence"
version = "1.0.0"
description = "ENS (RD 311/2022) evidence from open-source security scanners. Evidence, never a verdict."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Kept in step with requirements.txt by tests/test_packaging.py — a divergence
# between the two is how an installed tool ends up missing a dependency.
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.scripts]
ens-evidence = "ens_evidence.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The mapping tables and the report template are not optional extras: without them
# an installed tool cannot map a finding or render a report.
ens_evidence = ["mapping/*.yml", "templates/*.j2"]

# Appended by the repo-gates skill. Ruff's rule set is PINNED rather than left to
# the default: CI installs a newer ruff than your laptop sooner or later, and an
# unpinned set means CI enables rules (RUF100 and friends) that pass locally.
# This is the same set repo-a uses, so a file is judged identically in
# either repo.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: the package lives under src/, so tests import it from there without
# needing an editable install. The clean-venv install is verified separately.
pythonpath = ["src"]
markers = [
    "engines: needs real semgrep/trivy binaries on PATH (CI data gate runs -m 'not engines')",
]

[tool.bandit]
exclude_dirs = ["tests"]
