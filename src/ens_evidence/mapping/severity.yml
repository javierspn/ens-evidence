# Severity policy: each engine's own signal -> our canonical scale. Data, not code.
#
# The canonical scale is what `--fail-on` compares against and what the report groups by.
#
# PROVENANCE: authored 2026-07-25 from real Semgrep 1.171.0 and Trivy 0.72.0 SARIF over
# three repositories (see docs/scan-baseline.md). The two engines disagree about where
# severity lives, so each gets its own strategy — this file is why `strategy` exists at
# all rather than one flat table of severity strings:
#
#   * Trivy   — every rule carries properties."security-severity" AND a severity word in
#               properties.tags. For misconfiguration checks they agree. For CVEs they do
#               NOT: CVE-2024-56201 ships security-severity "8.8" (that field is the CVSS
#               v3 base score) while Trivy's own tag says MEDIUM. Trust the tag — it is
#               Trivy's verdict, including its vendor-severity overrides; the CVSS score is
#               a component of that verdict, not a substitute for it.
#   * Semgrep — NO rule carries security-severity, and results carry no `level` either.
#               The only signal is the rule's defaultConfiguration.level
#               (error / warning / note) plus a "<X> CONFIDENCE" string inside
#               properties.tags.
#
# Read severity from the RULE (tool.driver.rules[]), never from the result object.
#
# AUDITED 2026-07-28 against Semgrep 1.171.0 and Trivy 0.72.0 output, because the claims
# above were provenance-backed but unguarded — `canonical_rule_id` had just shown what an
# assumption nobody re-checked costs. What held, and what the tests now pin:
#
#   * Trivy: every rule carried both security-severity and a severity word tag (24/24), and
#     for THESE the tag and the result-level agreed in all 52 results. The divergence the
#     policy exists for is tag-vs-CVSS, not tag-vs-level: CVE-2024-56326 is tagged MEDIUM
#     with a score of 7.8, which bands as HIGH. Pinned by
#     test_trivys_severity_tag_beats_its_cvss_score.
#   * Semgrep: no rule carried security-severity (0/9) and no result carried `level`, so the
#     rule's defaultConfiguration is genuinely the only signal.
#   * The bands fallback had never executed in any test — every captured rule has a tag.
#     Now covered, so removing it fails rather than silently understating a 9.5.

version: 1

canonical: [critical, high, medium, low, info]

engines:
  # Severity word from properties.tags first; numeric bands on security-severity only as a
  # fallback when no severity tag is present. Observed tags: CRITICAL, HIGH, MEDIUM, LOW.
  trivy:
    strategy: severity_tag_then_bands
    tags:
      CRITICAL: critical
      HIGH: high
      MEDIUM: medium
      LOW: low
      UNKNOWN: info
    # Fallback only. Bands are CVSS v3 boundaries; observed values 2.0 / 3.7 / 5.3 / 5.5 /
    # 7.4 / 7.5 / 7.8 / 8.0 / 8.6 / 8.8 / 9.5.
    bands:
      critical: 9.0
      high: 7.0
      medium: 4.0
      low: 0.1

  # SARIF level, then a one-step downgrade when the rule tags itself LOW CONFIDENCE.
  # Rationale: `dynamic-urllib-use-detected` and `direct-use-of-jinja2` are both
  # LOW CONFIDENCE audit rules that fired on code review turned up as acceptable; without
  # the downgrade they sit at the same level as a confirmed raw-SQL execution.
  semgrep:
    strategy: sarif_level_with_confidence
    levels:
      error: high
      warning: medium
      note: low
      none: info
    confidence_adjust:
      LOW CONFIDENCE: -1     # one step down the canonical scale
      MEDIUM CONFIDENCE: 0
      HIGH CONFIDENCE: 0

# Anything an engine emits that the tables above do not cover resolves here rather than
# being silently dropped — a finding with unknown severity is still a finding.
default: medium
