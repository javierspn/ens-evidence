# scripts/gates.conf — this repo's gate settings, sourced by scripts/gates.sh (bash).
# Owned by this repo: `scaffold.sh --update` never touches it. Modules in use: scripts/gates.d/.

# Paths no module sees: vendored or generated code (ERE on the repo-relative path).
SKIP_RE='^$'

# `all` (CI) runs this instead of a module's default test runner, when set:
# TEST_CMD='./scripts/test.sh'
TEST_CMD=""

# python: source dirs and extension-less command scripts, space separated, no tests.
PY_ROOTS="src/ens_evidence scripts/unmapped_ids.py"
# PY_REQ=requirements-dev.txt     # pip-audit target
PYTEST_MARK="not engines and not rendering"

# yaml: files that are not yaml yet (templates with placeholders).
# YAML_SKIP_RE='^charts/'
